# Amplify Hosting build specification.
#
# Why this file exists at all — the app works on a laptop without it.
#
# Amplify Hosting hands the environment variables from its app settings to the *build*
# container only. Its running SSR compute deliberately gets none of them, so a
# `process.env.COGNITO_*` read at request time finds nothing and `lib/auth/config.ts`
# reports the pool as unconfigured — sign-in answers "something went wrong on our side"
# while the same code signs in fine locally. It is a documented limitation of the
# service, not a mistake in the app:
#   https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
#
# The supported workaround is the one below: write the variables the *server* half needs
# into `.env.production` before the build, which Next.js then also reads when the app
# serves traffic. The public half the browser needs (`NEXT_PUBLIC_COGNITO_*`) reaches
# the build the normal way, and is additionally referenced statically in
# `lib/auth/config.ts`, so the pool settings survive even if this step is dropped.
#
# This spec is mirrored in the app's own build settings in the Amplify console, so it
# does not matter which of the two the service decides to honour.
#
# The list is deliberately short, because of what the copy costs: anything written into
# `.env.production` becomes part of the deployment artifacts, and AWS warns that anyone
# with access to those artifacts can read them.
#
# `DATABASE_URL` used to stay out on the grounds that nothing in the serving code read
# it. That stopped being true when `/evidence` began listing `media_assets`, and the
# intake recorder, `/map` and the dashboard's hotspot figures now read and write it on
# every request. Without it the deployment does not fail — every one of those reports
# "no database", intakes are never filed, and the map stays empty for good — which is
# the worst kind of failure, because it looks like an empty city rather than a broken
# deploy. It is copied with the same caveat as the keys below: the password is on disk
# in the artifacts, it should be rotated if they are ever shared, and the design fix is
# an IAM role on the compute reading it from Secrets Manager (`computeRoleArn`).
#
# `AZURE_OPENAI_API_KEY` is the exception, and it is a considered one. The AI routes read it at
# request time, and unlike the pool settings it cannot be baked into the bundle: a
# non-public variable inlined at build time would ship the key to the browser. The
# alternative AWS recommends is an IAM role on the compute, which this app does not have
# — `computeRoleArn` is unset — and which is the right next step, reading the key from
# Secrets Manager or SSM instead of from a file. Until then the key lives in the
# environment, it is scoped to this one API, and it should be rotated if the deployment
# artifacts are ever shared.
#
# `S3_BUCKET`, `S3_REGION` and the media archive's key are copied for the same reason
# and with the same caveat: without the bucket the archive reports itself as off, and
# without the key the writes fail on the deployment while working on a laptop.
#
# Note the names. Amplify Hosting refuses to accept any environment variable beginning
# with `AWS` — "Environment variables cannot start with the reserved prefix \"AWS\"" is
# what the service answers — so `AWS_ACCESS_KEY_ID` can never be set on this app, and a
# grep for it here would match nothing forever. The app reads `S3_ACCESS_KEY_ID` /
# `S3_SECRET_ACCESS_KEY` for that reason and falls back to the SDK's own chain, which is
# what would run if this compute were ever given a role. This key is the stopgap; the
# role is the design.
#
# `PICKUP_API_URL` is copied for the same reason as the bucket — a server-side read at
# request time — and it is not a secret: the smart-pickup API is private behind the
# Cognito pool, so knowing its address buys nothing without a token. Interesting that
# this line can name the endpoint and nothing else, while the S3 half has to carry a
# credential through the build artifacts: that difference is the whole argument for
# authorising the API with the identity the app already has.
#
# `METALPRICE_API_KEY` is read at request time too, by the daily rate card, and carries
# the same caveat as the other keys. It is the cheapest of them to lose: a free-plan key
# for public market prices, and without it the last stored card simply stays in force.
#
# The three `PICKUP_TABLE_*` names are deliberately **not** copied. They are how the
# feature's own check script cleans up after itself on a laptop; nothing that serves a
# request has any business knowing how DynamoDB keys those tables.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -E '^(COGNITO_REGION|COGNITO_USER_POOL_ID|COGNITO_CLIENT_ID|COGNITO_ISSUER|COGNITO_ADMIN_ACCESS_KEY_ID|COGNITO_ADMIN_SECRET_ACCESS_KEY|AZURE_OPENAI_ENDPOINT|AZURE_OPENAI_API_KEY|AZURE_OPENAI_DEPLOYMENT|AZURE_SPEECH_REGION|AZURE_SPEECH_KEY|S3_BUCKET|S3_REGION|S3_PREFIX|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|PICKUP_API_URL|DATABASE_URL|METALPRICE_API_KEY)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
